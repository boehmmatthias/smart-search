services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  BoehmMatthias\SmartSearch\:
    resource: '../Classes/*'

  # Bind the embedding interface to the llama.cpp implementation.
  # Server URLs are configured via ext_conf_template.txt (TYPO3 Install Tool → Settings → Extension Configuration).
  # Both interfaces resolve to a dispatcher that honours the embeddingProvider and
  # generationProvider settings. Override either alias to bind a client of your own.
  BoehmMatthias\SmartSearch\Embedding\EmbeddingClientInterface:
    alias: BoehmMatthias\SmartSearch\Embedding\ConfigurableEmbeddingClient

  BoehmMatthias\SmartSearch\Generation\GenerationClientInterface:
    alias: BoehmMatthias\SmartSearch\Generation\ConfigurableGenerationClient

  # Declared explicitly rather than left to Symfony's singly-implemented-interface rule.
  # That rule works today only because LlmReranker is the sole implementation — the moment a
  # second one exists anywhere under Classes/, the implicit alias disappears and every consumer
  # type-hinting RerankerInterface fails at container compile time, which takes down the site
  # rather than just the extension.
  #
  # ChunkingStrategyInterface intentionally has no alias: ParagraphChunker and
  # SlidingWindowChunker are equal-standing choices with no sensible default, so consumers pass
  # the strategy they want to embedAndStoreChunked() explicitly.
  BoehmMatthias\SmartSearch\Reranking\RerankerInterface:
    alias: BoehmMatthias\SmartSearch\Reranking\LlmReranker

  # Reindex handlers are contributed by consuming extensions, which know their own records;
  # this extension cannot reindex anything on its own.
  BoehmMatthias\SmartSearch\Command\ReindexCommand:
    arguments:
      $handlers: !tagged_iterator smartsearch.reindex_handler

  BoehmMatthias\SmartSearch\Command\CleanupCommand:
    arguments:
      $providers: !tagged_iterator smartsearch.orphan_provider

  BoehmMatthias\SmartSearch\Service\VectorService:
    arguments:
      $cache: '@cache.smart_search_queries'

  BoehmMatthias\SmartSearch\Generation\StreamingGenerationClientInterface:
    alias: BoehmMatthias\SmartSearch\Generation\LlamaCppStreamingGenerationClient

  # Default binding so the container can resolve HybridSearchService out of the box. An unbound
  # interface fails container compilation, which takes down the whole site rather than just this
  # extension. NullKeywordSearch finds nothing, so hybrid search degrades to pure semantic search
  # until a consumer aliases this to their own implementation.
  BoehmMatthias\SmartSearch\Search\KeywordSearchInterface:
    alias: BoehmMatthias\SmartSearch\Search\NullKeywordSearch

  # The three slots are typed as the interface, so they must be wired by service id.
  BoehmMatthias\SmartSearch\Embedding\ConfigurableEmbeddingClient:
    arguments:
      $llamaCpp: '@BoehmMatthias\SmartSearch\Embedding\LlamaCppEmbeddingClient'
      $ollama: '@BoehmMatthias\SmartSearch\Embedding\OllamaEmbeddingClient'
      $openAi: '@BoehmMatthias\SmartSearch\Embedding\OpenAiEmbeddingClient'

  BoehmMatthias\SmartSearch\Generation\ConfigurableGenerationClient:
    arguments:
      $llamaCpp: '@BoehmMatthias\SmartSearch\Generation\LlamaCppGenerationClient'
      $ollama: '@BoehmMatthias\SmartSearch\Generation\OllamaGenerationClient'
      $openAi: '@BoehmMatthias\SmartSearch\Generation\OpenAiGenerationClient'
