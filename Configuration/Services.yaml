services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  BoehmMatthias\SmartSearch\:
    resource: '../Classes/*'

  # Bind the embedding interface to the llama.cpp implementation.
  # Server URLs are configured via ext_conf_template.txt (TYPO3 Install Tool → Settings → Extension Configuration).
  BoehmMatthias\SmartSearch\Embedding\EmbeddingClientInterface:
    alias: BoehmMatthias\SmartSearch\Embedding\LlamaCppEmbeddingClient

  BoehmMatthias\SmartSearch\Generation\GenerationClientInterface:
    alias: BoehmMatthias\SmartSearch\Generation\LlamaCppGenerationClient

  # Declared explicitly rather than left to Symfony's singly-implemented-interface rule.
  # That rule works today only because LlmReranker is the sole implementation — the moment a
  # second one exists anywhere under Classes/, the implicit alias disappears and every consumer
  # type-hinting RerankerInterface fails at container compile time, which takes down the site
  # rather than just the extension.
  #
  # ChunkingStrategyInterface intentionally has no alias: ParagraphChunker and
  # SlidingWindowChunker are equal-standing choices with no sensible default, so consumers pass
  # the strategy they want to embedAndStoreChunked() explicitly.
  BoehmMatthias\SmartSearch\Reranking\RerankerInterface:
    alias: BoehmMatthias\SmartSearch\Reranking\LlmReranker

  # Reindex handlers are contributed by consuming extensions, which know their own records;
  # this extension cannot reindex anything on its own.
  BoehmMatthias\SmartSearch\Command\ReindexCommand:
    arguments:
      $handlers: !tagged_iterator smartsearch.reindex_handler

  BoehmMatthias\SmartSearch\Command\CleanupCommand:
    arguments:
      $providers: !tagged_iterator smartsearch.orphan_provider
